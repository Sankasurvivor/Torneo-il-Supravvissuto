<head>
<meta charset="UTF-8">
<title>Ultimo Sopravvissuto — Serie A 2026/2027</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&family=Inter:wght@400;500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --pitch-1:#07211a;
    --pitch-2:#0e3b2c;
    --surface:#123a2c;
    --surface-hi:#164634;
    --line: rgba(244,241,234,0.10);
    --cream:#f2efe4;
    --cream-dim:#a9c2b3;
    --gold:#e8b84b;
    --gold-dim:#8a712f;
    --red:#e05a4e;
    --red-dim:#7a3c34;
    --blue:#5aa9c9;
    --radius:14px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      repeating-linear-gradient(180deg, rgba(255,255,255,0.018) 0 46px, rgba(255,255,255,0) 46px 92px),
      radial-gradient(circle at 15% -10%, #17503a 0%, transparent 45%),
      radial-gradient(circle at 110% 10%, #0f3f2e 0%, transparent 40%),
      linear-gradient(180deg, var(--pitch-1), var(--pitch-2) 60%, #08251c 100%);
    color:var(--cream);
    font-family:'Inter',sans-serif;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  #app{max-width:960px;margin:0 auto;padding:22px 18px 80px;}
  .disp{font-family:'Teko',sans-serif;text-transform:uppercase;letter-spacing:0.02em;font-weight:600;line-height:0.95;}
  .mono{font-family:'Space Mono',monospace;}
  .muted{color:var(--cream-dim);}
  a{color:inherit;}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:22px;flex-wrap:wrap;}
  .brand{display:flex;align-items:center;gap:12px;}
  .brand-badge{
    width:46px;height:46px;border-radius:50%;
    background:conic-gradient(from 220deg, var(--gold), #b98a1f, var(--gold));
    display:flex;align-items:center;justify-content:center;
    font-family:'Teko';font-weight:700;font-size:20px;color:#12280e;
    box-shadow:0 0 0 3px rgba(232,184,75,0.15);
    flex-shrink:0;
  }
  .brand h1{font-size:30px;margin:0;letter-spacing:0.01em;}
  .brand .sub{font-size:12px;color:var(--cream-dim);letter-spacing:0.14em;text-transform:uppercase;font-family:'Inter';font-weight:600;}
  .top-actions{display:flex;gap:8px;flex-wrap:wrap;}

  button{font-family:'Inter',sans-serif;cursor:pointer;border:none;border-radius:10px;font-weight:700;letter-spacing:0.01em;transition:transform .12s ease, filter .12s ease;}
  button:active{transform:scale(0.97);}
  .btn{background:var(--surface-hi);color:var(--cream);padding:10px 16px;font-size:13.5px;border:1px solid var(--line);}
  .btn:hover{filter:brightness(1.15);}
  .btn-primary{background:var(--gold);color:#1c2a12;padding:11px 18px;font-size:14px;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-primary:disabled{background:#4a4a3f;color:#8b8b7d;cursor:not-allowed;}
  .btn-ghost{background:transparent;color:var(--cream-dim);border:1px solid var(--line);padding:9px 14px;font-size:13px;}
  .btn-ghost:hover{color:var(--cream);border-color:rgba(244,241,234,0.3);}
  .btn-danger{background:var(--red-dim);color:#ffe4e0;padding:9px 14px;font-size:13px;}
  .btn-sm{padding:6px 11px;font-size:12px;border-radius:8px;}
  .btn-block{width:100%;}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:20px;margin-bottom:16px;}
  .card-title{font-family:'Teko';font-size:22px;text-transform:uppercase;letter-spacing:0.03em;margin:0 0 12px;color:var(--gold);}
  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:var(--cream-dim);margin-bottom:6px;font-weight:600;}
  input[type=text],input[type=password],input[type=number],select{
    width:100%;background:#0c2a20;border:1px solid var(--line);border-radius:8px;color:var(--cream);
    padding:10px 12px;font-size:14.5px;font-family:'Inter';
  }
  input:focus,select:focus{outline:2px solid var(--gold);outline-offset:1px;}
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{ -webkit-appearance:none; margin:0; }
  input[type=number]{ -moz-appearance:textfield; }
  .err{color:var(--red);font-size:13px;margin-top:8px;}
  .ok{color:#8fd99a;font-size:13px;margin-top:8px;}

  .hero{text-align:center;padding:34px 10px 10px;}
  .hero .disp{font-size:56px;color:var(--cream);}
  .hero .disp em{font-style:normal;color:var(--gold);}
  .hero p{color:var(--cream-dim);max-width:480px;margin:10px auto 0;font-size:14.5px;line-height:1.5;}
  .role-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:26px;}
  @media(max-width:560px){.role-grid{grid-template-columns:1fr;}}
  .role-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:22px;text-align:left;cursor:pointer;transition:border-color .15s, transform .15s;}
  .role-card:hover{border-color:var(--gold);transform:translateY(-2px);}
  .role-card .ico{font-size:26px;margin-bottom:8px;display:block;}
  .role-card h3{font-family:'Teko';font-size:22px;margin:0 0 4px;text-transform:uppercase;color:var(--cream);}
  .role-card p{margin:0;color:var(--cream-dim);font-size:13px;line-height:1.4;}
  .classifica-link{display:block;text-align:center;margin-top:18px;color:var(--cream-dim);font-size:13px;text-decoration:underline;background:none;border:none;}

  .player-list{max-height:280px;overflow-y:auto;border:1px solid var(--line);border-radius:10px;margin-top:4px;}
  .player-item{padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px;display:flex;justify-content:space-between;align-items:center;}
  .player-item:last-child{border-bottom:none;}
  .player-item:hover{background:var(--surface-hi);}
  .player-item .tag{font-size:11px;color:var(--cream-dim);}

  .lives-row{display:flex;gap:22px;align-items:center;flex-wrap:wrap;}
  .life{display:flex;align-items:center;gap:8px;}
  .life .shield{width:30px;height:32px;border-radius:6px 6px 12px 12px;display:flex;align-items:center;justify-content:center;font-size:15px;border:1.5px solid var(--line);}
  .life .shield.avail{background:rgba(232,184,75,0.14);border-color:var(--gold);}
  .life .shield.used{background:rgba(224,90,78,0.14);border-color:var(--red);}
  .life .txt{font-size:12.5px;}
  .life .txt b{display:block;font-size:13px;color:var(--cream);}
  .life .txt span{color:var(--cream-dim);}

  .status-pill{display:inline-flex;align-items:center;gap:6px;padding:5px 12px;border-radius:100px;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;}
  .status-pill.ingioco{background:rgba(90,169,201,0.18);color:#89cfe9;}
  .status-pill.eliminato{background:rgba(224,90,78,0.18);color:#f4a89e;}
  .status-pill.vincitore{background:rgba(232,184,75,0.22);color:var(--gold);}

  .gstrip{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:6px;}
  .gpill{
    flex-shrink:0;width:42px;height:42px;border-radius:8px;display:flex;align-items:center;justify-content:center;
    font-family:'Teko';font-size:17px;font-weight:600;background:var(--surface-hi);border:1.5px solid var(--line);color:var(--cream-dim);cursor:pointer;
  }
  .gpill.active{border-color:var(--gold);color:var(--gold);}
  .gpill.done-win{background:rgba(90,169,201,0.16);color:#89cfe9;border-color:rgba(90,169,201,0.4);}
  .gpill.done-lifeS,.gpill.done-lifeP{background:rgba(232,184,75,0.16);color:var(--gold);border-color:rgba(232,184,75,0.4);}
  .gpill.done-elim{background:rgba(224,90,78,0.18);color:#f4a89e;border-color:var(--red);}
  .gpill.locked{opacity:0.45;}

  .team-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px;margin-top:10px;}
  .team-opt{
    border:1.5px solid var(--line);background:var(--surface-hi);border-radius:10px;padding:12px 10px;text-align:center;cursor:pointer;
    font-size:13.5px;font-weight:600;
  }
  .team-opt:hover{border-color:var(--gold);}
  .team-opt.selected{border-color:var(--gold);background:rgba(232,184,75,0.14);color:var(--gold);}
  .team-opt.disabled{opacity:0.32;cursor:not-allowed;text-decoration:line-through;}
  .team-opt .vs{display:block;font-size:10.5px;color:var(--cream-dim);margin-top:3px;font-weight:400;}

  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;color:var(--cream-dim);font-size:11px;text-transform:uppercase;letter-spacing:0.06em;padding:8px 8px;border-bottom:1px solid var(--line);}
  td{padding:9px 8px;border-bottom:1px solid rgba(244,241,234,0.06);}
  tr:last-child td{border-bottom:none;}
  .esito-tag{font-size:11px;font-weight:700;padding:3px 8px;border-radius:6px;text-transform:uppercase;}
  .esito-vinta{background:rgba(120,200,140,0.16);color:#95dba5;}
  .esito-persa{background:rgba(224,90,78,0.16);color:#f4a89e;}
  .esito-pareggio{background:rgba(232,184,75,0.16);color:var(--gold);}
  .esito-attesa{background:rgba(255,255,255,0.06);color:var(--cream-dim);}

  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line);}
  .tab{padding:9px 14px;font-size:13px;font-weight:700;color:var(--cream-dim);cursor:pointer;border-bottom:2px solid transparent;}
  .tab.active{color:var(--gold);border-color:var(--gold);}

  .notice{background:rgba(90,169,201,0.10);border:1px solid rgba(90,169,201,0.3);border-radius:10px;padding:12px 14px;font-size:13px;color:#bfe0f0;margin-bottom:14px;}
  .warn{background:rgba(232,184,75,0.10);border:1px solid rgba(232,184,75,0.35);border-radius:10px;padding:12px 14px;font-size:13px;color:#f0dfae;margin-bottom:14px;}

  .empty{text-align:center;padding:30px 10px;color:var(--cream-dim);font-size:13.5px;}
  .foot-note{text-align:center;color:var(--cream-dim);font-size:11.5px;margin-top:26px;opacity:0.7;line-height:1.6;}
  .row-between{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .small{font-size:12px;}
  .spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(244,241,234,0.25);border-top-color:var(--gold);border-radius:50%;animation:spin .7s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .toolist{list-style:none;padding:0;margin:0;}
  .toolist li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(244,241,234,0.06);font-size:13.5px;}
</style>
</head>

/* ============================================================
   STATO APP (in memoria, nessun localStorage per policy artifact)
   ============================================================ */
const State = {
  screen: 'landing',
  giocatori: null,
  risultati: null,
  currentPlayer: null,
  adminPw: null,
  isAdmin: false,
  activeGiornata: 1,
  adminTab: 'risultati',
  adminGiornata: 1,
  loading: true,
  loadError: null,
  torneoStart: 1,
};

const DEFAULT_ADMIN_PW = 'sopravvissuto2027';

function globalIndex(m){ return DATA.matches.indexOf(m); }

async function bootstrap(){
  State.loading = true; State.loadError = null; render();
  try{
    let rows = await fetchGiocatori();
    if(!rows || rows.length===0){
      const initial = DATA.players.map(p => ({id:p.num, nome:p.name, pin:null}));
      await bulkInsertGiocatori(initial);
      rows = initial;
    }
    State.giocatori = rows;

    const risRows = await fetchRisultati();
    State.risultati = {};
    (risRows||[]).forEach(r=>{ State.risultati[r.match_idx] = r.risultato; });

    let pw = await fetchConfig('admin_pw');
    if(!pw){ pw = DEFAULT_ADMIN_PW; await setConfig('admin_pw', pw); }
    State.adminPw = pw;

    let start = await fetchConfig('torneo_start');
    State.torneoStart = start ? parseInt(start) : 1;

    State.loading = false;
  } catch(e){
    State.loadError = e.message || String(e);
    State.loading = false;
  }
  render();
}

async function refreshShared(){
  try{
    const rows = await fetchGiocatori();
    if(rows) State.giocatori = rows;
    const risRows = await fetchRisultati();
    State.risultati = {};
    (risRows||[]).forEach(r=>{ State.risultati[r.match_idx] = r.risultato; });
    const start = await fetchConfig('torneo_start');
    if(start) State.torneoStart = parseInt(start);
  }catch(e){ /* mantieni ultimo stato noto */ }
}

async function getPronostici(playerId){
  try{
    const rows = await fetchPronosticiFor(playerId);
    const obj = {};
    (rows||[]).forEach(r=>{ obj[r.giornata] = r.squadra; });
    return obj;
  }catch(e){ return {}; }
}

/* ============================================================
   LOGICA DI GIOCO
   ============================================================ */
function giornateList(){
  const s = new Set(DATA.matches.map(m=>m.giornata));
  return Array.from(s).sort((a,b)=>a-b);
}
const ALL_GIORNATE = giornateList();

function parseDate(dstr){
  const [d,m,y] = dstr.split('/').map(Number);
  return new Date(y, m-1, d);
}
function giornataDate(g){
  const m = DATA.matches.find(x=>x.giornata===g);
  return m ? parseDate(m.data) : null;
}
function giornataHasKickedOff(g){
  const d = giornataDate(g);
  if(!d) return false;
  const today = new Date(); today.setHours(0,0,0,0);
  return today >= d;
}
function giornataHasAnyResult(g){
  return DATA.matches.some(m => m.giornata===g && State.risultati[globalIndex(m)] !== undefined);
}
function isGiornataLocked(g){
  return giornataHasKickedOff(g) || giornataHasAnyResult(g);
}
function matchesForGiornata(g){
  return DATA.matches.filter(m=>m.giornata===g);
}
function teamsInGiornata(g){
  const list = [];
  matchesForGiornata(g).forEach(m=>{ list.push({team:m.casa, opp:m.trasferta, casa:true, match:m}); list.push({team:m.trasferta, opp:m.casa, casa:false, match:m}); });
  return list;
}

function computeEsito(match, pick){
  const key = globalIndex(match);
  const res = State.risultati[key];
  if(res === undefined) return null;
  const parts = res.split('-').map(Number);
  const h = parts[0], a = parts[1];
  if(isNaN(h) || isNaN(a)) return null;
  const isCasa = match.casa === pick;
  if(h === a) return 'Pareggio';
  if(isCasa) return h > a ? 'Vinta' : 'Persa';
  return a > h ? 'Vinta' : 'Persa';
}

function currentGiornateRange(){
  return ALL_GIORNATE.filter(g=>g>=State.torneoStart);
}

function computePlayerState(pronostici){
  let lifeS=false, lifeP=false, eliminated=false, eliminatedGiornata=null;
  const history=[];
  const range = currentGiornateRange();
  for(const g of range){
    const pick = pronostici[g];
    if(!pick) continue;
    const match = matchesForGiornata(g).find(m=>m.casa===pick||m.trasferta===pick);
    if(!match) continue;
    const esito = computeEsito(match, pick);
    let vitaEvent = null;
    if(!eliminated && esito){
      if(esito==='Persa'){
        if(lifeS){ eliminated=true; eliminatedGiornata=g; vitaEvent='Eliminato — 2ª sconfitta'; }
        else { lifeS=true; vitaEvent='Vita Sconfitta usata'; }
      } else if(esito==='Pareggio'){
        if(lifeP){ eliminated=true; eliminatedGiornata=g; vitaEvent='Eliminato — 2° pareggio'; }
        else { lifeP=true; vitaEvent='Vita Pareggio usata'; }
      }
    }
    history.push({giornata:g, squadra:pick, avversario: match.casa===pick?match.trasferta:match.casa, casa: match.casa===pick, esito, vitaEvent, locked: isGiornataLocked(g)});
  }
  const squadreUsate = range.map(g=>pronostici[g]).filter(Boolean);
  const giornateGiocate = history.filter(h=>h.esito).length;
  return {lifeS, lifeP, eliminated, eliminatedGiornata, history, squadreUsate, giornateGiocate};
}

function nextActionableGiornata(pronostici, state){
  const range = currentGiornateRange();
  if(state.eliminated) return null;
  for(const g of range){
    if(!pronostici[g] && !isGiornataLocked(g)) return g;
  }
  for(let i=range.length-1;i>=0;i--){
    if(pronostici[range[i]]) return range[i];
  }
  return range[0];
}

/* ============================================================
   UTIL
   ============================================================ */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(dstr){
  const d = parseDate(dstr);
  const giorni=['dom','lun','mar','mer','gio','ven','sab'];
  const mesi=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  return giorni[d.getDay()]+' '+d.getDate()+' '+mesi[d.getMonth()];
}

/* ============================================================
   RENDER
   ============================================================ */
function render(){
  const app = document.getElementById('app');
  if(State.loading){ app.innerHTML = '<div class="empty"><span class="spinner"></span> Caricamento torneo...</div>'; return; }
  if(State.loadError){
    app.innerHTML = renderTopbar() + `<div class="card"><div class="card-title">Errore di connessione al database</div><p class="muted small">${esc(State.loadError)}</p><button class="btn-primary btn" id="btn-retry">Riprova</button></div>`;
    const btn = document.getElementById('btn-retry'); if(btn) btn.addEventListener('click', bootstrap);
    return;
  }
  let html = renderTopbar();
  if(State.screen==='landing') html += renderLanding();
  else if(State.screen==='player-login') html += renderPlayerLogin();
  else if(State.screen==='player-dash') html += renderPlayerDash();
  else if(State.screen==='classifica') html += renderClassificaLoading();
  else if(State.screen==='admin-login') html += renderAdminLogin();
  else if(State.screen==='admin-dash') html += renderAdminDash();
  html += renderFootnote();
  app.innerHTML = html;
  attachHandlers();
}

    right += `<button class="btn-ghost btn" id="btn-logout">Esci (${esc(State.currentPlayer.nome)})</button>`;
  }
  if(State.isAdmin){
    right += `<button class="btn-ghost btn" id="btn-logout-admin">Esci admin</button>`;
  }
  return `
  <div class="topbar">
    <div class="brand">

function pillClassFor(h){
  if(!h) return '';
  if(h.vitaEvent && h.vitaEvent.startsWith('Eliminato')) return 'done-elim';
  if(h.vitaEvent === 'Vita Sconfitta usata') return 'done-lifeS';
  if(h.vitaEvent === 'Vita Pareggio usata') return 'done-lifeP';
  if(h.esito === 'Vinta') return 'done-win';
  return '';
}

function renderPlayerDash(){
  const player = State.currentPlayer;
  const pron = State._pron || {};
  const st = computePlayerState(pron);
  const histByG = {}; st.history.forEach(h=>histByG[h.giornata]=h);
  const g = State.activeGiornata;
  const locked = isGiornataLocked(g);
  const alreadyPicked = pron[g];
  const usedTeamsElsewhere = new Set(currentGiornateRange().filter(x=>x!==g).map(x=>pron[x]).filter(Boolean));

  let stripHtml = currentGiornateRange().map(gg=>{
    const h = histByG[gg];
    const cls = ['gpill'];
    if(gg===g) cls.push('active');
    if(h) cls.push(pillClassFor(h)); else if(isGiornataLocked(gg)) cls.push('locked');
    return `<div class="${cls.join(' ')}" data-g="${gg}">${gg}</div>`;
  }).join('');

  let panel = '';
  if(st.eliminated && g > st.eliminatedGiornata){
    panel = `<div class="warn">Sei stato eliminato alla giornata ${st.eliminatedGiornata}. Il torneo prosegue per gli altri, ma per te qui finisce — puoi comunque rivedere il tuo percorso.</div>`;
  } else if(locked && !alreadyPicked){
    panel = `<div class="warn">Questa giornata è già iniziata e non hai registrato un pronostico: niente pronostico, niente vita a rischio, ma niente punti nemmeno.</div>`;
  } else if(locked && alreadyPicked){
    const h = histByG[g];
    panel = renderLockedPick(g, h, alreadyPicked);
  } else {
    panel = renderPickForm(g, alreadyPicked, usedTeamsElsewhere);
  }

  return `
  <div class="card">
    <div class="row-between">
      <div>
        <div class="card-title" style="margin-bottom:2px;">${esc(player.nome)}</div>
        <div class="muted small">${st.giornateGiocate} giornate giocate · ${st.squadreUsate.length} squadre bruciate${State.torneoStart>1?` · torneo dalla giornata ${State.torneoStart}`:''}</div>
      </div>
    </div>
    <div style="margin-top:12px;">${renderLifeShields(st)}</div>
  </div>

  <div class="card">
    <div class="card-title">Giornata ${g} <span class="muted" style="font-family:'Inter';font-size:13px;font-weight:400;">— ${esc(matchesForGiornata(g)[0]? fmtDate(matchesForGiornata(g)[0].data):'')}</span></div>
    <div class="gstrip">${stripHtml}</div>
    ${panel}
  </div>

  <div class="card">
    <div class="card-title">Il tuo percorso</div>
    ${st.history.length===0 ? '<div class="empty">Ancora nessun pronostico registrato.</div>' : `
    <table>
      <thead><tr><th>G.</th><th>Squadra</th><th>Avversario</th><th>Esito</th><th>Nota</th></tr></thead>
      <tbody>
        ${st.history.slice().reverse().map(h=>`
          <tr>
            <td class="mono">${h.giornata}</td>
            <td>${esc(h.squadra)}</td>
            <td class="muted">${h.casa?'vs':'@'} ${esc(h.avversario)}</td>
            <td>${h.esito ? `<span class="esito-tag esito-${h.esito.toLowerCase()}">${h.esito}</span>` : `<span class="esito-tag esito-attesa">in attesa</span>`}</td>
            <td class="muted small">${h.vitaEvent?esc(h.vitaEvent):''}</td>
          </tr>`).join('')}
      </tbody>
    </table>`}
  </div>
  `;
}

function renderPickForm(g, alreadyPicked, usedTeamsElsewhere){
  const teams = teamsInGiornata(g);
  const currentSelection = State._pendingPick || alreadyPicked;
  const opts = teams.map(t=>{
    const usedElsewhere = usedTeamsElsewhere.has(t.team);
    const isSel = currentSelection === t.team;
    const cls = ['team-opt']; if(isSel) cls.push('selected'); if(usedElsewhere) cls.push('disabled');
    return `<div class="${cls.join(' ')}" ${usedElsewhere?'':`data-team="${esc(t.team)}"`}>
      ${esc(t.team)}<span class="vs">${t.casa?'in casa vs':'in trasferta @'} ${esc(t.opp)}</span>
      ${usedElsewhere?'<span class="vs">già bruciata</span>':''}
    </div>`;
  }).join('');
  return `
  <div class="notice">Scegli la squadra che secondo te vince questa giornata. Puoi cambiare idea finché la giornata non comincia.</div>
  <div class="team-grid">${opts}</div>
  <div class="row-between" style="margin-top:16px;">
    <div class="small muted" id="pick-feedback"></div>
    <button class="btn-primary btn" id="btn-save-pick" ${!State._pendingPick?'disabled':''}>Salva pronostico</button>
  </div>`;
}

function buildClassificaRows(){
  return State.giocatori.map(p=>{
    const pron = (State._allPron && State._allPron[p.id]) || {};
    const st = computePlayerState(pron);
    return {p, st};
  });

function renderClassificaTable(){
  const rows = buildClassificaRows();
  rows.sort((a,b)=>{
    if(a.st.eliminated !== b.st.eliminated) return a.st.eliminated ? 1 : -1;
    if(a.st.eliminated && b.st.eliminated) return (b.st.eliminatedGiornata||0) - (a.st.eliminatedGiornata||0);
    return b.st.giornateGiocate - a.st.giornateGiocate;
  });
  const inGioco = rows.filter(r=>!r.st.eliminated);
  let banner = '';
  if(rows.length>1 && inGioco.length===1){
    banner = `<div class="warn">🏆 <b>${esc(inGioco[0].p.nome)}</b> è l'ultimo sopravvissuto del torneo!</div>`;
  } else if(rows.length>1 && inGioco.length===0){
    const maxG = Math.max(...rows.map(r=>r.st.eliminatedGiornata||0));
    const cowinners = rows.filter(r=>r.st.eliminatedGiornata===maxG).map(r=>r.p.nome);
    banner = `<div class="warn">Torneo concluso: tutti eliminati. Sopravvissuti più a lungo (G${maxG}): <b>${cowinners.map(esc).join(', ')}</b></div>`;
  }
  return `
  <div class="card">
    <div class="row-between">
      <div class="card-title" style="margin:0;">Classifica</div>
      ${State.torneoStart>1?`<span class="small muted">Torneo attuale: dalla giornata ${State.torneoStart}</span>`:''}
    </div>
    ${banner}
    <table>
      <thead><tr><th>#</th><th>Giocatore</th><th>Stato</th><th>Vita S.</th><th>Vita P.</th><th>Giornate</th></tr></thead>
      <tbody>
      ${rows.map((r,i)=>`
        <tr>
          <td class="mono">${i+1}</td>
          <td>${esc(r.p.nome)}</td>
          <td>${r.st.eliminated?`<span class="status-pill eliminato">Elim. G${r.st.eliminatedGiornata}</span>`:`<span class="status-pill ingioco">In gioco</span>`}</td>
          <td class="muted small">${r.st.eliminated?'—':(r.st.lifeS?'Usata':'Disp.')}</td>
          <td class="muted small">${r.st.eliminated?'—':(r.st.lifeP?'Usata':'Disp.')}</td>
          <td class="mono">${r.st.giornateGiocate}</td>
        </tr>`).join('')}
      </tbody>
    </table>
  </div>`;
}

  const tabs = ['risultati','forza','giocatori','classifica','impostazioni'];
  const labels = {risultati:'Risultati', forza:'Forza pronostico', giocatori:'Giocatori', classifica:'Classifica', impostazioni:'Impostazioni'};
  let tabsHtml = tabs.map(t=>`<div class="tab ${State.adminTab===t?'active':''}" data-tab="${t}">${labels[t]}</div>`).join('');
  let content = '';
  if(State.adminTab==='risultati') content = renderAdminRisultati();
  else if(State.adminTab==='forza') content = renderAdminForza();
  else if(State.adminTab==='giocatori') content = renderAdminGiocatori();
  else if(State.adminTab==='classifica') content = renderClassificaTable();
  else if(State.adminTab==='impostazioni') content = renderAdminSettings();
  return `<div class="tabs">${tabsHtml}</div>${content}`;
}

function renderAdminForza(){
  const players = [...State.giocatori].sort((a,b)=>a.nome.localeCompare(b.nome));
  const playerOpts = `<option value="">— scegli giocatore —</option>` + players.map(p=>`<option value="${p.id}" ${State._forzaPlayerId===p.id?'selected':''}>${esc(p.nome)}</option>`).join('');

  let body = `
  <div class="card">
    <div class="card-title">Forza pronostico</div>
    <div class="notice">Usa questa sezione se un giocatore ti comunica il pronostico in ritardo: qui puoi inserirlo o correggerlo per lui, anche se la giornata è già bloccata per tutti gli altri.</div>
    <div class="field">
      <label>Giocatore</label>
      <select id="forza-player-select">${playerOpts}</select>
    </div>`;

  if(State._forzaPlayerId){
    const g = State._forzaGiornata || 1;
    const gOpts = ALL_GIORNATE.map(gg=>`<option value="${gg}" ${gg===g?'selected':''}>Giornata ${gg} — ${fmtDate(matchesForGiornata(gg)[0].data)}</option>`).join('');
    const pron = State._forzaPron || {};
    const currentPick = pron[g];
    const usedElsewhereSet = new Set(ALL_GIORNATE.filter(x=>x!==g).map(x=>pron[x]).filter(Boolean));
    const teams = teamsInGiornata(g);
    const pending = State._forzaPending;
    const selection = pending || currentPick;

    body += `
    <div class="field">
      <label>Giornata</label>
      <select id="forza-g-select">${gOpts}</select>
    </div>
    <div class="team-grid">
      ${teams.map(t=>{
        const usedElsewhere = usedElsewhereSet.has(t.team);
        const isSel = selection === t.team;
        const cls = ['team-opt']; if(isSel) cls.push('selected'); if(usedElsewhere) cls.push('disabled');
        return `<div class="${cls.join(' ')}" data-forza-team="${esc(t.team)}">
          ${esc(t.team)}<span class="vs">${t.casa?'in casa vs':'in trasferta @'} ${esc(t.opp)}</span>
          ${usedElsewhere?'<span class="vs">già usata altrove — verrà comunque forzata</span>':''}
        </div>`;
      }).join('')}
    </div>
    <div class="row-between" style="margin-top:16px;">
      <div class="small muted" id="forza-feedback"></div>
      <button class="btn-primary btn" id="btn-save-forza" ${!pending?'disabled':''}>Salva pronostico forzato</button>
    </div>`;

    const historyRows = ALL_GIORNATE.filter(gg=>pron[gg]).map(gg=>`<tr><td class="mono">${gg}</td><td>${esc(pron[gg])}</td></tr>`).join('');
    body += `
    <div style="margin-top:18px;">
      <div class="card-title" style="font-size:18px;">Pronostici già registrati per questo giocatore</div>
      ${historyRows ? `<table><thead><tr><th>Giornata</th><th>Squadra</th></tr></thead><tbody>${historyRows}</tbody></table>` : '<div class="muted small">Nessun pronostico ancora registrato.</div>'}
    </div>`;
  }

  body += `</div>`;
  return body;
}

function renderAdminRisultati(){
  const g = State.adminGiornata;
  const matches = matchesForGiornata(g);
  const opts = ALL_GIORNATE.map(gg=>`<option value="${gg}" ${gg===g?'selected':''}>Giornata ${gg} — ${fmtDate(matchesForGiornata(gg)[0].data)}</option>`).join('');
  return `
  <div class="card">
    <div class="row-between">
      <div class="card-title" style="margin:0;">Inserisci risultati</div>
      <select id="admin-g-select" style="max-width:260px;">${opts}</select>
    </div>
    <table style="margin-top:10px;">
      <thead><tr><th>Casa</th><th></th><th>Trasferta</th><th></th></tr></thead>
      <tbody>
      ${matches.map(m=>{
        const idx = globalIndex(m);
        const res = State.risultati[idx];
        const [h,a] = res ? res.split('-') : ['',''];
        return `<tr>
          <td>${esc(m.casa)}</td>
          <td style="width:70px;"><input type="number" min="0" max="20" class="mono res-h" data-idx="${idx}" value="${h}" style="text-align:center;font-size:16px;"></td>
          <td>${esc(m.trasferta)}</td>
          <td style="width:70px;"><input type="number" min="0" max="20" class="mono res-a" data-idx="${idx}" value="${a}" style="text-align:center;font-size:16px;"></td>
        </tr>`;
      }).join('')}
      </tbody>
    </table>
    <div class="row-between" style="margin-top:14px;">
      <div class="small muted" id="admin-res-feedback"></div>
      <button class="btn-primary btn" id="btn-save-risultati">Salva risultati giornata ${g}</button>
    </div>
  </div>`;
}

function renderAdminGiocatori(){
  return `
  <div class="card">
    <div class="card-title">Aggiungi giocatore</div>
    <div class="grid2">
      <input type="text" id="new-player-name" placeholder="Nome giocatore">
      <button class="btn-primary btn" id="btn-add-player">Aggiungi</button>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Elenco giocatori (${State.giocatori.length})</div>
    <ul class="toolist">
      ${State.giocatori.slice().sort((a,b)=>a.nome.localeCompare(b.nome)).map(p=>`
        <li>
          <span>${esc(p.nome)} <span class="muted small">${p.pin?'· PIN impostato':'· nessun PIN'}</span></span>
          <span>
            ${p.pin?`<button class="btn-ghost btn btn-sm" data-reset-pin="${p.id}">Reset PIN</button>`:''}
            <button class="btn-danger btn btn-sm" data-remove="${p.id}">Rimuovi</button>
          </span>
        </li>`).join('')}
    </ul>
  </div>`;
}

function renderAdminSettings(){
  const opts = ALL_GIORNATE.map(gg=>`<option value="${gg}" ${gg===State.torneoStart?'selected':''}>Giornata ${gg}</option>`).join('');
  return `
  <div class="card">
    <div class="card-title">Cambia password amministratore</div>
    <div class="field"><input type="password" id="new-admin-pw" placeholder="Nuova password"></div>
    <button class="btn-primary btn" id="btn-change-pw">Aggiorna password</button>
    ${State._pwFeedback?`<div class="ok">${esc(State._pwFeedback)}</div>`:''}
  </div>
  <div class="card">
    <div class="card-title">Nuovo torneo</div>
    <p class="muted small">Se il torneo attuale finisce (es. tutti eliminati alla giornata 12) e vuoi farne ripartire uno nuovo dalla giornata successiva, imposta qui da quale giornata ricominciare: vite ed eliminazioni si azzerano automaticamente per tutti, mentre lo storico delle giornate precedenti resta salvato nel database.</p>
    <p class="small" style="color:var(--gold);">Torneo attuale: parte dalla giornata <b>${State.torneoStart}</b>.</p>
    <div class="field">
      <label>Ricomincia dalla giornata</label>
      <select id="torneo-start-select">${opts}</select>
    </div>
    <button class="btn-primary btn" id="btn-nuovo-torneo">Avvia nuovo torneo da questa giornata</button>
    ${State._torneoFeedback?`<div class="ok">${esc(State._torneoFeedback)}</div>`:''}
  </div>
  <div class="card">
    <div class="card-title">Esporta backup</div>
    <p class="muted small">Scarica un file JSON con giocatori, pronostici e risultati correnti — utile come copia di sicurezza.</p>
    <button class="btn btn-ghost" id="btn-export">Scarica backup JSON</button>
  </div>`;
}

/* ============================================================
   EVENTI
   ============================================================ */
function attachHandlers(){
  const app = document.getElementById('app');

  const on = (id, ev, fn) => { const el = document.getElementById(id); if(el) el.addEventListener(ev, fn); };

  on('btn-home', 'click', ()=>{ State.screen='landing'; State.currentPlayer=null; State.isAdmin=false; State._selectedForLogin=null; render(); });
  on('btn-classifica', 'click', async ()=>{ await openClassifica(); });
  on('btn-classifica-link', 'click', async ()=>{ await openClassifica(); });
  on('btn-logout', 'click', ()=>{ State.currentPlayer=null; State._pron=null; State.screen='landing'; render(); });
  on('btn-logout-admin', 'click', ()=>{ State.isAdmin=false; State.screen='landing'; render(); });

  on('card-player', 'click', async ()=>{
    State.screen='player-login'; State._selectedForLogin=null; State._playerFilter=''; render();
    await refreshShared(); render();
  });
  on('card-admin', 'click', ()=>{ State.screen='admin-login'; State._loginError=null; render(); });

  on('player-search', 'input', (e)=>{ State._playerFilter = e.target.value; render(); setTimeout(()=>{ const el=document.getElementById('player-search'); if(el){ el.focus(); el.selectionStart=el.selectionEnd=el.value.length; } },0); });

  app.querySelectorAll('.player-item[data-id]').forEach(el=>{
    el.addEventListener('click', async ()=>{
      const id = parseInt(el.getAttribute('data-id'));
      await refreshShared();
      State._selectedForLogin = State.giocatori.find(p=>p.id===id);
      State._loginError = null;
      render();
      setTimeout(()=>{ const pin=document.getElementById('pin-input'); if(pin) pin.focus(); },0);
    });
  });

  on('btn-back-select', 'click', ()=>{ State._selectedForLogin=null; render(); });
  on('btn-do-login', 'click', async ()=>{ await doPlayerLogin(); });
  on('pin-input', 'keydown', (e)=>{ if(e.key==='Enter') doPlayerLogin(); });

  on('btn-admin-login', 'click', async ()=>{
    const pw = document.getElementById('admin-pw-input').value;
    if(pw === State.adminPw){
      State.isAdmin = true; State.screen='admin-dash'; State.adminTab='risultati'; State._loginError=null;
      await refreshShared();
      render();
    } else {
      State._loginError = 'Password errata.'; render();
      setTimeout(()=>document.getElementById('admin-pw-input')?.focus(),0);
    }
  });
  on('admin-pw-input','keydown',(e)=>{ if(e.key==='Enter') document.getElementById('btn-admin-login')?.click(); });

  app.querySelectorAll('.gpill[data-g]').forEach(el=>{
    el.addEventListener('click', ()=>{ State.activeGiornata = parseInt(el.getAttribute('data-g')); State._pendingPick=null; render(); });
  });

  app.querySelectorAll('.team-opt[data-team]').forEach(el=>{
    el.addEventListener('click', ()=>{
      State._pendingPick = el.getAttribute('data-team');
      render();
    });
  });
  on('btn-save-pick', 'click', async ()=>{ await savePick(); });

  on('admin-g-select', 'change', (e)=>{ State.adminGiornata = parseInt(e.target.value); render(); });
  on('btn-save-risultati', 'click', async ()=>{ await saveRisultati(); });

  on('forza-player-select', 'change', async (e)=>{
    const id = parseInt(e.target.value) || null;
    State._forzaPlayerId = id;
    State._forzaGiornata = 1;
    State._forzaPending = null;
    if(id){ State._forzaPron = await getPronostici(id); } else { State._forzaPron = null; }
    render();
  });
  on('forza-g-select', 'change', (e)=>{ State._forzaGiornata = parseInt(e.target.value); State._forzaPending = null; render(); });
  app.querySelectorAll('.team-opt[data-forza-team]').forEach(el=>{
    el.addEventListener('click', ()=>{ State._forzaPending = el.getAttribute('data-forza-team'); render(); });
  });
  on('btn-save-forza', 'click', async ()=>{ await saveForzaPick(); });

  app.querySelectorAll('.tab[data-tab]').forEach(el=>{
    el.addEventListener('click', ()=>{ State.adminTab = el.getAttribute('data-tab'); render(); });
  });

  on('btn-add-player', 'click', async ()=>{ await addPlayer(); });
  app.querySelectorAll('[data-remove]').forEach(el=>{
    el.addEventListener('click', async ()=>{ await removePlayer(parseInt(el.getAttribute('data-remove'))); });
  });
  app.querySelectorAll('[data-reset-pin]').forEach(el=>{
    el.addEventListener('click', async ()=>{ await resetPin(parseInt(el.getAttribute('data-reset-pin'))); });
  });

  on('btn-change-pw', 'click', async ()=>{ await changeAdminPw(); });
  on('btn-nuovo-torneo', 'click', async ()=>{ await avviaNuovoTorneo(); });
  on('btn-export', 'click', async ()=>{ await exportBackup(); });
}

async function doPlayerLogin(){
  const sel = State._selectedForLogin;
  const pinEl = document.getElementById('pin-input');
  const pin = pinEl ? pinEl.value.trim() : '';
  if(!/^\d{4}$/.test(pin)){ State._loginError='Il PIN deve avere 4 cifre.'; render(); return; }
  await refreshShared();
  const fresh = State.giocatori.find(p=>p.id===sel.id);
  if(!fresh){ State._loginError='Giocatore non trovato.'; render(); return; }
  if(!fresh.pin){
    try{
      await updateGiocatore(fresh.id, {pin: pin});
      fresh.pin = pin;
    }catch(e){
      State._loginError = 'Errore di connessione, riprova.'; render(); return;
    }
  } else if(fresh.pin !== pin){
    State._loginError='PIN errato.'; render(); return;
  }
  State.currentPlayer = fresh;
  State._pron = await getPronostici(fresh.id);
  State.activeGiornata = nextActionableGiornata(State._pron, computePlayerState(State._pron)) || 1;
  State._pendingPick = null;
  State.screen='player-dash';
  render();
}

async function savePick(){
  if(!State._pendingPick) return;
  const g = State.activeGiornata;
  if(isGiornataLocked(g)){ State._pendingPick=null; render(); return; }
  const squadra = State._pendingPick;
  try{
    await upsertPronostico(State.currentPlayer.id, g, squadra);
    State._pron[g] = squadra;
  }catch(e){
    alert('Errore nel salvataggio: ' + (e.message||e));
  }
  State._pendingPick = null;
  render();
}

async function openClassifica(){
  State.screen='classifica';
  render();
  try{
    await refreshShared();
    const rows = await fetchAllPronostici();
    State._allPron = {};
    (rows||[]).forEach(r=>{
      if(!State._allPron[r.player_id]) State._allPron[r.player_id]={};
      State._allPron[r.player_id][r.giornata] = r.squadra;
    });
  }catch(e){ /* mostra comunque quello che c'è */ }
  const app = document.getElementById('app');
  app.innerHTML = renderTopbar() + renderClassificaTable() + renderFootnote();
  attachHandlers();
}

async function saveRisultati(){
  const app = document.getElementById('app');
  const hs = app.querySelectorAll('.res-h');
  const rows = [];
  hs.forEach(el=>{
    const idx = el.getAttribute('data-idx');
    const aEl = app.querySelector('.res-a[data-idx="'+idx+'"]');
    const hv = el.value.trim(); const av = aEl.value.trim();
    if(hv!=='' && av!==''){ rows.push({match_idx: parseInt(idx), risultato: hv+'-'+av}); }
  });
  try{
    if(rows.length) await upsertRisultati(rows);
    await refreshShared();
    const fb = document.getElementById('admin-res-feedback');
    if(fb) fb.textContent = 'Risultati salvati ✓';
  }catch(e){
    alert('Errore nel salvataggio: ' + (e.message||e));
  }
  render();
}

async function saveForzaPick(){
  if(!State._forzaPlayerId || !State._forzaPending) return;
  const playerId = State._forzaPlayerId;
  const g = State._forzaGiornata;
  const squadra = State._forzaPending;
  try{
    await upsertPronostico(playerId, g, squadra);
    State._forzaPron = State._forzaPron || {};
    State._forzaPron[g] = squadra;
    State._forzaPending = null;
  }catch(e){
    alert('Errore nel salvataggio: ' + (e.message||e));
  }
  render();
}

async function addPlayer(){
  const input = document.getElementById('new-player-name');
  const name = input.value.trim();
  if(!name) return;
  await refreshShared();
  const nextId = State.giocatori.length ? Math.max(...State.giocatori.map(p=>p.id))+1 : 1;
  try{
    await insertGiocatore({id: nextId, nome: name, pin: null});
    await refreshShared();
  }catch(e){
    alert('Errore: ' + (e.message||e));
  }
  render();
}
async function removePlayer(id){
  if(!confirm('Rimuovere questo giocatore? I suoi pronostici resteranno salvati ma non sarà più in classifica.')) return;
  try{
    await deleteGiocatore(id);
    await refreshShared();
  }catch(e){
    alert('Errore: ' + (e.message||e));
  }
  render();
}
async function resetPin(id){
  try{
    await updateGiocatore(id, {pin: null});
    await refreshShared();
  }catch(e){}
  render();
}
async function changeAdminPw(){
  const val = document.getElementById('new-admin-pw').value.trim();
  if(val.length<4) return;
  try{
    await setConfig('admin_pw', val);
    State.adminPw = val;
    State._pwFeedback = 'Password aggiornata.';
  }catch(e){
    alert('Errore: ' + (e.message||e));
  }
  render();
}
async function avviaNuovoTorneo(){
  const val = parseInt(document.getElementById('torneo-start-select').value);
  if(!confirm('Sei sicuro? Da questo momento tutti i giocatori ripartiranno con 2 vite fresche dalla giornata ' + val + '. Le giornate precedenti restano salvate ma non conteranno più ai fini di vite ed eliminazioni.')) return;
  try{
    await setConfig('torneo_start', String(val));
    State.torneoStart = val;
    State._torneoFeedback = 'Nuovo torneo avviato dalla giornata ' + val + '.';
  }catch(e){
    alert('Errore: ' + (e.message||e));
  }
  render();
}
async function exportBackup(){
  try{
    await refreshShared();
    const rows = await fetchAllPronostici();
    const allPron = {};
    (rows||[]).forEach(r=>{ if(!allPron[r.player_id]) allPron[r.player_id]={}; allPron[r.player_id][r.giornata]=r.squadra; });
    const backup = { giocatori: State.giocatori, risultati: State.risultati, pronostici: allPron, esportato: new Date().toISOString() };
    const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'ultimo-sopravvissuto-backup.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    alert('Errore export: ' + (e.message||e));
  }
}

bootstrap();
</script>
</body>
</html>
